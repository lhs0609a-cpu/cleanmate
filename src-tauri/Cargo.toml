[package]
name = "teraclean"
version = "0.10.1"
description = "확실한 건 알아서, 애매한 것만 딱 물어보는 정리 도구"
authors = ["TeraClean"]
edition = "2021"

# 데스크톱 전용이라 라이브러리 크레이트가 필요 없다. main.rs 하나로 된 바이너리.
# (모바일 대응 시에만 lib.rs + main.rs 분리가 필요하다.)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 트레이 상주(V3·알약처럼 조용히 떠 있기)
# image-png: 트레이 아이콘을 PNG에서 만든다
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2" # 폴더 선택 다이얼로그
# 두 번 실행되지 않게. 자동시작으로 이미 떠 있는데 사용자가 아이콘을 또 누르면
# 프로세스가 둘이 된다 — 두 번째는 조용히 죽고 원래 창을 띄운다.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 자동 업데이트 다운로드용
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
# 업데이트 무결성 검증 — 받은 설치파일의 SHA-256을 계산해 릴리스 값과 대조한다
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
# 설치 크기를 줄인다 — 신뢰·가벼움이 제품의 얼굴이다.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
