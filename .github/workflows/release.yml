# 릴리스 빌드 — 태그를 밀면 설치파일이 자동으로 나온다.
#
#   git tag v0.1.0 && git push origin v0.1.0
#     → 이 워크플로가 클라우드(윈도우)에서:
#         1. 프론트엔드(vite) + Tauri(Rust) 빌드
#         2. (인증서가 있으면) 앱 바이너리 코드 서명
#         3. 이노셋업으로 TeraClean-Setup-x.y.z.exe 생성 → 설치파일도 서명
#         4. 설치파일 SHA-256을 계산해 업데이트 장부(latest.json)에 박고
#            GitHub Release에 설치파일과 함께 게시
#
# ★ 로컬에 아무것도 설치할 필요 없다. 드라이브 폴더의 빌드 문제도 여기선 없다
#   (깨끗한 환경에서 npm install을 새로 한다).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # 이 저장소엔 아무것도 쓰지 않는다 — 릴리스는 배포 저장소로 나간다

env:
  # ★ 설치파일을 게시하는 '공개' 저장소. 이 저장소(소스)는 비공개다.
  #
  #   왜 나눴나: 앱과 홈페이지가 릴리스 API로 "최신 버전이 뭐고 어디서 받나"를 읽는다.
  #   비공개 저장소의 릴리스 API는 인증 없이 부르면 404를 준다(있는데 없다고 답한다).
  #   그러면 홈페이지 다운로드 버튼과 설치된 앱의 자동 업데이트가 통째로 막힌다.
  #   실제로 그 상태였다 — 그래서 설치파일만 두는 공개 저장소를 따로 뒀다.
  RELEASES_REPO: lhs0609a-cpu/teraclean-releases

jobs:
  build:
    runs-on: windows-latest
    # ★ 시크릿을 잡(job) 환경변수로 한 번 꺼내 둔다.
    #
    #   왜: step의 `if:` 에서는 secrets 컨텍스트를 쓸 수 없다. 쓰면
    #   "Unrecognized named-value: 'secrets'"로 워크플로 파일 전체가 무효가 되고,
    #   푸시마다 0초짜리 실패 런이 찍히며 **태그를 밀어도 릴리스가 안 나온다.**
    #   실제로 그 상태로 여러 주가 지났다(v0.4.0 이후 릴리스가 한 번도 안 나간 이유).
    #   env 컨텍스트는 `if:` 에서 쓸 수 있으므로 여기로 우회한다.
    env:
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
      RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전 추출 (태그 v0.1.0 → 0.1.0)
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: 의존성 설치
        # npm ci 대신 install — 드라이브 폴더에서 package-lock을 갱신할 수 없어
        # lock이 뒤처질 수 있다. install은 스스로 맞춘다.
        run: npm install

      - name: 엔진 테스트 (여기서 막아야 사고가 안 나간다)
        # npm test 대신 직접 부른다. `src/**/*.test.ts`는 globstar가 꺼져 있으면
        # `src/*/*.test.ts`로 줄어 최상위 테스트(quarantine·updater)를 놓친다.
        # 셸마다 다르게 동작할 여지를 없애려고 명시적으로 켠다.
        shell: bash
        run: |
          shopt -s globstar
          node --experimental-strip-types --no-warnings --test src/**/*.test.ts

      - name: 브랜드 자산 생성 (og.png · favicon)
        # 이미지 도구 없이 벡터로 굽는다. 빌드마다 새로 만들어 소스와 어긋나지 않게.
        run: node scripts/make-brand.mjs

      - name: 프론트엔드 빌드 (→ dist/)
        run: npm run build

      # ★ 글꼴은 없어도 빌드가 성공한다 — 그게 문제다.
      #   빠지면 에러도 빈 화면도 없이 그냥 맑은 고딕으로 돌아가고, 아무도 모른다.
      #   실제로 그 상태로 오래 있었다(스택 1순위 Pretendard가 윈도우엔 없었다).
      #   그래서 '산출물에 실제로 담겼는지'를 여기서 못 박는다.
      - name: 글꼴이 빌드 산출물에 담겼는지 확인
        shell: bash
        run: |
          f=dist/fonts/PretendardVariable.woff2
          test -s "$f" || { echo "::error::글꼴이 dist에 없습니다 — 앱이 조용히 맑은 고딕으로 돌아갑니다"; exit 1; }
          head -c4 "$f" | grep -q wOF2 || { echo "::error::$f 가 woff2가 아닙니다"; exit 1; }
          echo "글꼴 OK — $(wc -c < "$f") bytes"

      # ★ 아이콘 자산: 크기마다 **직접 그린다**.
      #   전에는 `tauri icon`으로 1024 원본을 축소했는데, 그러면 16·32px에서
      #   대괄호가 뭉갠다 — 하필 작업표시줄·alt-tab에서 제일 자주 보이는 크기다.
      #   make-logo.mjs는 크기마다 그 크기에 맞는 원도를 쓴다(작으면 T만).
      #   나오는 것: assets/logo.png · icons/{32x32,128x128,128x128@2x,tray}.png · icon.ico
      - name: 아이콘 생성
        run: node scripts/make-logo.mjs

      - name: Tauri 빌드 (→ teraclean.exe + 리소스)
        run: npx tauri build

      # ★ 엔진 사이드카: 검증된 TS 엔진을 단일 exe로 포장한다.
      #   esbuild로 한 덩어리 CJS로 묶고, Node 내장 SEA로 런타임을 심는다.
      #   사용자는 Node를 안 깔아도 된다.
      - name: 엔진 번들 (esbuild → CJS)
        run: npx esbuild src/engine-cli.ts --bundle --platform=node --format=cjs --outfile=dist-engine/engine.cjs

      # 엔진 exe: Node 내장 SEA로. 외부 바이너리를 안 받고 러너의 node.exe를
      # 그대로 쓴다(pkg의 미리빌드 404 문제 회피).
      - name: 엔진 exe 생성 (Node SEA)
        shell: bash
        run: |
          mkdir -p dist-app
          echo '{ "main": "dist-engine/engine.cjs", "output": "dist-engine/sea.blob" }' > dist-engine/sea-config.json
          node --experimental-sea-config dist-engine/sea-config.json
          node -e "require('fs').copyFileSync(process.execPath, 'dist-app/teraclean-engine.exe')"
          npx --yes postject dist-app/teraclean-engine.exe NODE_SEA_BLOB dist-engine/sea.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: 이노셋업이 담을 폴더 구성 (dist-app/)
        shell: bash
        run: |
          cp src-tauri/target/release/teraclean.exe dist-app/
          ls -la dist-app/

      # ── 코드 서명 ───────────────────────────────────────────────
      # 인증서 시크릿이 없으면 아래 세 단계를 모두 건너뛴다(빌드는 계속 성공).
      # 서명 없이 나가면 첫 실행 때 SmartScreen "알 수 없는 게시자" 경고가 뜬다.
      #
      # 준비물 (GitHub → Settings → Secrets and variables → Actions)
      #   CODESIGN_PFX_BASE64   OV/EV 코드서명 인증서 .pfx 를 base64로 인코딩한 문자열
      #                         만들기: certutil -encode cert.pfx cert.txt → 헤더/꼬리 줄 제거
      #   CODESIGN_PFX_PASSWORD 그 .pfx 의 비밀번호
      - name: 인증서 준비
        id: cert
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          # signtool은 윈도우 러너의 Windows SDK에 들어 있다. 가장 최신 SDK를 쓴다.
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw 'signtool.exe를 찾지 못했어요 — Windows SDK 경로 확인 필요' }
          "pfx=$path" >> $env:GITHUB_OUTPUT
          "signtool=$($st.FullName)" >> $env:GITHUB_OUTPUT

      - name: 앱 바이너리 서명 (설치파일에 담기기 전에)
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          & '${{ steps.cert.outputs.signtool }}' sign `
            /f '${{ steps.cert.outputs.pfx }}' /p $env:PFX_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            dist-app\teraclean.exe dist-app\teraclean-engine.exe
          if ($LASTEXITCODE -ne 0) { throw '앱 바이너리 서명 실패' }

      - name: 이노셋업 설치
        run: choco install innosetup --no-progress -y

      - name: 설치파일 생성 (TeraClean-Setup-x.y.z.exe)
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} installer/teraclean.iss

      - name: 설치파일 서명
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          & '${{ steps.cert.outputs.signtool }}' sign `
            /f '${{ steps.cert.outputs.pfx }}' /p $env:PFX_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist-installer\TeraClean-Setup-${{ steps.ver.outputs.version }}.exe"
          if ($LASTEXITCODE -ne 0) { throw '설치파일 서명 실패' }
          Remove-Item '${{ steps.cert.outputs.pfx }}' -Force

      # ★ 업데이트 장부 — signature에 설치파일의 SHA-256을 박는다.
      #   앱은 받은 파일의 해시가 이 값과 같을 때만 실행한다
      #   (updater.ts의 verifyIntegrity + main.rs의 실행 직전 재대조).
      #   서명이 비면 앱이 업데이트를 거절하므로, 계산이 실패하면 릴리스를 내지 않는다.
      #
      #   ★ 순서 주의: 반드시 서명 '뒤에' 계산해야 한다. 서명하면 파일이 바뀌어
      #     해시도 바뀐다. 앞에서 계산하면 모든 업데이트가 불일치로 거절된다.
      - name: 업데이트 장부(latest.json) 생성 + SHA-256 서명
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VER=${{ steps.ver.outputs.version }}
          EXE="dist-installer/TeraClean-Setup-${VER}.exe"
          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          echo "설치파일 SHA-256: $SHA"
          # 64자 16진수가 아니면 여기서 멈춘다 — 빈 서명이 배포되면 안 된다
          if ! echo "$SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "SHA-256 계산 실패 — 릴리스를 중단합니다" >&2
            exit 1
          fi
          # ★ 이 저장소가 아니라 '배포 저장소'의 URL이다 (아래 게시 단계 주석 참고)
          URL="https://github.com/${RELEASES_REPO}/releases/download/v${VER}/TeraClean-Setup-${VER}.exe"
          cat > latest.json <<EOF
          {
            "version": "${VER}",
            "notes": "자동 생성 릴리스",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "${URL}",
            "signature": "${SHA}"
          }
          EOF
          cat latest.json
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # ★ 고정 이름 사본 — 랜딩의 폴백 링크가 이것 하나에 달려 있다.
      #
      #   랜딩 다운로드 버튼은 JS가 GitHub API로 최신 자산 주소를 읽어 채우는데,
      #   그 길이 막히는 사람이 있다(JS 끔·사내망에서 api.github.com 차단·시간당
      #   한도 초과). 그 사람들은 아래 고정 주소로 간다:
      #     releases/latest/download/TeraClean-Setup.exe
      #   이 주소는 릴리스마다 **같은 이름의 사본**이 올라가야만 산다.
      #
      #   ★ 실제로 v0.22.0에서 이게 빠져 폴백이 404였다. 사본을 만드는 스크립트는
      #     있었지만(scripts/publish-release.mjs) CI가 부르질 않아서, 여태 사람이
      #     손으로 올려 왔다 — 한 번 잊으면 그대로 깨진다. 그래서 여기로 옮겼다.
      #
      #   ★ 순서 주의: 반드시 서명 '뒤에' 복사해야 한다. 서명하면 파일이 바뀐다.
      #     앞에서 복사하면 두 파일의 바이트가 갈라지고, 고정 이름으로 받은 사람만
      #     latest.json의 해시와 불일치해 업데이트가 거절된다.
      - name: 고정 이름 사본 만들기 (폴백 링크용)
        shell: bash
        run: |
          set -euo pipefail
          VER=${{ steps.ver.outputs.version }}
          SRC="dist-installer/TeraClean-Setup-${VER}.exe"
          DST="dist-installer/TeraClean-Setup.exe"
          cp "$SRC" "$DST"
          # 바이트가 같아야 한다 — 해시가 갈리면 업데이터가 거절한다
          a=$(sha256sum "$SRC" | cut -d' ' -f1)
          b=$(sha256sum "$DST" | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "::error::사본 해시가 원본과 다릅니다"; exit 1; }
          echo "고정 이름 사본 OK — $b"

      # ★ 게시가 막혀도 빌드 결과는 버리지 않는다.
      #   실제로 토큰이 없어 게시 단계에서 멈췄는데, 그때 만들어진 설치파일이
      #   러너와 함께 사라져서 11분짜리 빌드가 통째로 헛일이 됐다.
      #   여기 올려두면 토큰이 없어도 런 페이지에서 받아 설치할 수 있다.
      #
      # ★★ 이 단계는 절대 릴리스를 막아선 안 된다 (continue-on-error).
      #   v0.9.6에서 이걸로 릴리스가 통째로 안 나갔다. 빌드·서명·설치파일 생성이
      #   전부 성공한 뒤, 여기서 "Artifact storage quota has been hit"으로 실패했고
      #   그러면 잡이 실패로 꺾여서 **게시 단계가 아예 실행되지 않았다.**
      #   보험으로 넣은 단계가 정작 본 작업을 막은 셈이다.
      #   보관은 게시가 막혔을 때의 대비책이지 릴리스의 조건이 아니다.
      #
      #   retention-days: 게시된 릴리스가 이미 같은 exe를 영구 보관한다. 여기 쌓인
      #   19개(약 450MB)가 무료 용량을 다 먹어서 위 사고가 났다. 짧게 두고 버린다.
      - name: 설치파일 보관 (게시가 막혀도 받을 수 있게)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TeraClean-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist-installer/TeraClean-Setup-${{ steps.ver.outputs.version }}.exe
            latest.json
          if-no-files-found: warn
          retention-days: 7

      # 시크릿이 없으면 여기서 '조용히 넘어가지 않고' 멈춘다.
      # 게시가 안 된 릴리스는 성공으로 보고돼선 안 된다 — 그게 다운로드가 막혀 있는데
      # 초록불이 켜져 있던 원인이다.
      - name: 배포 토큰 확인
        # ★ 윈도우 러너의 기본 셸은 pwsh다. $RELEASES_REPO 를 그대로 쓰면
        #   빈 문자열로 찍혀서 "배포 저장소()에" 같은 메시지가 나온다(실제로 그랬다).
        shell: bash
        if: env.RELEASES_REPO_TOKEN == ''
        run: |
          echo "::error::RELEASES_REPO_TOKEN 시크릿이 없어 배포 저장소(${RELEASES_REPO})에 게시할 수 없습니다."
          echo "::error::GitHub → Settings → Secrets and variables → Actions 에 등록하세요."
          echo "::error::필요 권한: ${RELEASES_REPO} 의 Contents=Read and write (fine-grained PAT)"
          echo "::notice::설치파일은 이 실행의 Artifacts에 올려뒀습니다 — 지금 받아서 수동 설치할 수 있어요."
          exit 1

      # ★ 이 저장소가 아니라 배포 저장소로 게시한다.
      #   GITHUB_TOKEN은 자기 저장소에만 쓸 수 있어서 별도 PAT가 필요하다.
      #   tag_name을 명시해야 한다 — 태그는 이 저장소에 있고 대상 저장소엔 없다
      #   (액션이 대상 저장소의 기본 브랜치에 태그를 만든다).
      - name: GitHub Release 게시 (배포 저장소)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: 테라클린 ${{ steps.ver.outputs.version }}
          # 파일이 하나라도 안 붙으면 실패시킨다 — 자산 없는 릴리스가 나가면
          # 홈페이지가 exe를 못 찾아 다운로드가 폴백으로 떨어진다.
          fail_on_unmatched_files: true
          files: |
            dist-installer/TeraClean-Setup-${{ steps.ver.outputs.version }}.exe
            dist-installer/TeraClean-Setup.exe
            latest.json
          body: |
            테라클린 ${{ steps.ver.outputs.version }}

            설치파일을 받아 실행하세요. 이후 새 버전이 나오면 앱이 알려드리고,
            확인하시면 받아서 검증한 뒤 설치합니다.

            **설치파일 SHA-256**
            `${{ steps.manifest.outputs.sha }}`

            앱은 받은 파일의 해시가 이 값과 같을 때만 설치합니다. 직접 받으셨다면
            `certutil -hashfile TeraClean-Setup-${{ steps.ver.outputs.version }}.exe SHA256`
            으로 대조해 보실 수 있습니다.
